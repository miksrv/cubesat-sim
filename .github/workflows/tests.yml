name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No hardware extra: the whole point of the HAL is that the suite runs
      # anywhere. CUBESAT_MOCK_HARDWARE is set by tests/conftest.py.
      - name: Install
        run: pip install -e ".[test]"

      - name: Lint
        run: ruff check src tests

      # The hardware extras are not installed here, so the drivers' lazy imports
      # (smbus2, picamera2, meshtastic, RPi) have no stubs to check against and
      # are ignored in pyproject.toml. Everything else is checked.
      - name: Types
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing
