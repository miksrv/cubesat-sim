# CubeSat Sim — runtime defaults.
#
# Environment variables override every value here (see .env and README).
# Secrets and per-deployment values are environment-only and must never appear
# in this file: there is deliberately no YAML key for an API token.

mqtt:
  broker: localhost
  port: 1883
  keepalive: 60

logging:
  level: INFO

heartbeat:
  interval_sec: 10       # every service publishes to cubesat/heartbeat this often
  miss_threshold: 3      # consecutive misses before OBC declares a subsystem lost

# Poll interval in seconds, per service, per mission state.
#
# This table is what makes LOW_POWER mean something: without it, "power saving"
# is a label on a state that changes no behaviour. A profile can scale all of it
# at once via power.cadence_scale (DIAG polls everything faster).
#
# A value of 0 means "do not act in this state at all" — used for the radio in
# SAFE, where the satellite goes quiet rather than slow.
# A DEPLOY row is not optional for anything OBC waits on. Bring-up gives each
# subsystem a bounded window to produce its first status message, and without an
# explicit row a service falls back to 30 s — longer than the window itself, so a
# perfectly healthy satellite would fail its own self-test. Measured, not
# theorised: it is the reason these rows exist.
cadence:
  obc:
    default: 30          # heartbeat and state republish; state-independent

  eps:
    STANDBY: 60
    DEPLOY: 10
    NOMINAL: 30
    LOW_POWER: 60
    SAFE: 60
    CRITICAL: 10         # watch closely while deciding to shut down

  adcs:
    DEPLOY: 0.5          # report in well inside the bring-up window
    NOMINAL: 0.5         # 2 Hz
    LOW_POWER: 5.0       # 0.2 Hz
    SAFE: 5.0

  payload:
    DEPLOY: 2            # report in well inside the bring-up window
    NOMINAL: 60
    LOW_POWER: 300
    SAFE: 300

  dhs:
    DEPLOY: 2            # report in well inside the bring-up window
    NOMINAL: 30
    LOW_POWER: 300
    SAFE: 300

  comms:
    STANDBY: 30          # HOSTED: wake to poll the radio inbox; never beacons
    DEPLOY: 2            # report in well inside the bring-up window
    NOMINAL: 30
    LOW_POWER: 60
    SAFE: 60             # keep listening — see the beacon table below

  dashboard:
    default: 5           # liveness tick; live data arrives by subscription

# How often the radio *transmits*, per mission state. Separate from the cadence
# above, which is how often COMMS wakes up — and the separation is the point.
#
# An earlier version silenced COMMS entirely in SAFE by giving it a cadence of
# zero. That silenced receiving too, and SAFE is reachable from FLIGHT through a
# subsystem fault: the state where a `recover` command is most needed would have
# been the one state deaf to it, on a profile where the radio is the only way in.
# Listening costs no airtime — the radio is receiving anyway and a poll is a
# memory read — so COMMS keeps waking, and only the transmission slows down.
#
# SAFE still beacons, just rarely. A satellite that goes quiet exactly when
# something is wrong is a satellite nobody can help; safe mode exists to stay
# contactable, not to hide.
beacon:
  # 60 rather than 30: the beacon is proof of life with a position, and the
  # query commands (!sys, !env, !pos, !mission) now answer on demand — routine
  # airtime on a shared mesh was not buying anything a minute would not.
  NOMINAL: 60
  LOW_POWER: 300
  SAFE: 600

# The flight recorder's own settings.
eps:
  # The charge rate is computed by EPS from the state-of-charge history: the
  # X728's gauge is a MAX17040/41 and has no rate register (verified
  # 2026-09-01, docs/hardware-x728-ups-hat.md). A least-squares slope over this
  # many seconds of readings is published as charge_rate, in percent per hour.
  # 600 s is long enough that the SOC register's 1/256 % steps average out
  # against the policy's -1 %/h threshold, and short enough that a charger that
  # stops charging is noticed within the time the pack would take to lose a
  # percent or two.
  charge_rate_window_sec: 600
  # Until the window holds this much history the rate is published as null,
  # which the power policy reads as "trust the mains pin". Also the time it
  # takes to know the rate again after the pin changes, because the history is
  # discarded then: a battery-time slope must not follow the satellite onto
  # mains, or a flat pack just plugged in would look like one still draining.
  charge_rate_min_span_sec: 300

dhs:
  # The floor on how often one attitude sample is recorded. ADCS publishes
  # orientation at 2 Hz, and in DIAG — where cadence_scale is 0.2 against a
  # 0.5 s interval — at 10; without a ceiling here a bench session would write
  # ten rows a second to the card for as long as it ran.
  #
  # This costs SD-card writes and nothing else. DHS holds no hardware and reads
  # no bus, so what ADCS puts on the wire costs exactly the same whether it is
  # recorded or discarded — do not reach for this number hoping to unload I2C.
  #
  # 1.0 records every second sample at 2 Hz: about 5 MB for a working day, and
  # choppier than the eye wants on its own. A viewer interpolates between
  # quaternions, which is most of why the table stores them rather than Euler
  # angles. Lower it for smoother replay at a linear cost in card writes.
  attitude_min_interval_sec: 1.0
  # How many samples may wait in memory for a write that is failing. At 1 Hz
  # this is roughly two hours of holding on before the oldest start to go —
  # long enough to ride out a card that comes back, bounded so that one that
  # does not cannot take the process with it.
  attitude_buffer: 7200
  # The same bound for radio events (see cubesat/comms/radio). Radio traffic
  # is sparse — a beacon a minute in NOMINAL — so this covers hours of a
  # failing card before the oldest events start to go.
  radio_buffer: 512

retention:
  # How long a telemetry row lives. Missions themselves are kept: a purged
  # mission still leaves its row in `missions`, so a trip that happened is still
  # listed even after its detail has aged out.
  days: 30
  # Photos follow their mission: purging a mission removes its photo directory.
  # Turning this off keeps the database bounded and leaves the card unbounded,
  # which on a satellite whose only unbounded writer is the camera means the
  # card fills and the next failed write is a telemetry row.
  purge_photos: true
  # Segments shorter than this do not count toward a mission's distance. A
  # stationary consumer GNSS receiver wanders by metres, and without a floor a
  # satellite left on a windowsill overnight reports a walk it never took.
  min_segment_m: 5.0

dashboard:
  # How many telemetry rows the dashboard keeps in memory for its charts.
  #
  # This is the history in DEMO and EXPO, which deliberately write nothing to
  # the card (see profiles.yaml): DHS publishes each assembled row on
  # cubesat/dhs/telemetry and the service keeps the last this many. At the 30 s
  # NOMINAL cadence 720 rows is about six hours — longer than any demonstration,
  # and a few megabytes of RAM on a machine that has gigabytes.
  #
  # It is not an archive: it starts empty on every service start and dies with
  # the process. A recorded mission is read from SQLite instead, and while one
  # is open — FLIGHT and DIAG — /api/telemetry serves that mission rather than
  # this ring, because the database survives a restart of the dashboard and the
  # ring does not.
  live_history_rows: 720

photos:
  # The camera is the only unbounded writer on this satellite: telemetry rows are
  # small and bounded by a retention horizon, while a mission's photographs are
  # bounded only by how long the trip lasts. Below this much free space PAYLOAD
  # refuses to capture and stops the running series, because the next write to
  # fail on a full card is the telemetry row the mission exists to record. It
  # never deletes anything on the card — retention is DHS's job.
  min_free_mb: 512

  # How often an open mission photographs by itself, in seconds.
  #
  # There is no take-a-timelapse command any more (decided 2026-09-01): a
  # recorded mission is a trip, a trip wants pictures along the way, and nobody
  # was going to remember to ask for them before walking out of the house. So
  # frames are taken on this cadence for as long as a mission is open, and they
  # stop when it closes. On foot, 300 s is a frame every few hundred metres.
  #
  # Two things it costs, both worth knowing before lowering it. Each frame is a
  # few hundred kilobytes on the card, and the card is what wears out. And with
  # camera.idle_close_sec below this, every frame is a *cold* capture: the sensor
  # is reopened for it. Whether Picamera2's auto-exposure has converged by then
  # was bench check V11, and it was settled on 2026-09-01 — see the note at
  # camera.idle_close_sec: it does, and a cold frame costs latency, not quality.
  mission_interval_sec: 300

camera:
  resolution: [1920, 1080]   # still capture size, [width, height]
  # How long the camera stays open after its last use. An open Picamera2 runs
  # the whole ISP pipeline continuously — auto-exposure and white balance never
  # sleep — which is measurable SoC heat on a satellite that may not take a
  # photo for hours. After this many seconds of no captures the sensor is given
  # back; the next capture re-opens it (about a second). A mission series faster
  # than this keeps the camera warm; a slower one lets it cool between frames,
  # which is the right trade at the intervals where reopening is cheap relative
  # to the wait — and photos.mission_interval_sec is deliberately slower, so a
  # mission's frames are cold captures by design. 0 keeps the camera open
  # forever, as before.
  # Bench-verified 2026-09-01 (ROADMAP V11, now settled): a cold capture and a
  # warm one of the same indoor scene, 5 s apart, came out identical — luma
  # mean 94.2 vs 94.6, same RGB means, same 5th/95th percentiles — with the
  # cold frame published 0.97 s after the command and the warm one 0.21 s. So
  # AE/AWB converge within the reopen, and no settle delay is needed here.
  idle_close_sec: 60.0

science:
  # SEN0501 board revision: v1 (LTR390) or v3 (S12DS). Unset means the UV index
  # is withheld rather than guessed — the two formulas disagree by a factor of
  # forty and nothing here can tell which board is fitted. See ROADMAP V7.
  sen0501_revision: null
