# CubeSat Sim — what a browser may do on the WebSocket listener.
#
# Installed to /etc/mosquitto/cubesat-acl.conf — NOT into conf.d/, where
# mosquitto would parse it as broker configuration and fail to start — and
# attached to the 9001 listener alone (see cubesat.conf:
# per_listener_settings). The services on localhost:1883 are not governed by
# this file.
#
# Read everything. Telemetry is not secret — the satellite beacons it over an
# open mesh — and a dashboard that cannot see the bus has nothing to draw.
topic read cubesat/#

# Write the one topic the ground is supposed to write. `cubesat/command` is the
# single entry point for every ground client: a laptop on the LAN, the `cubesat`
# CLI, COMMS relaying an uplink off the radio, and now the dashboard. Nothing
# downstream knows or cares which of them a command came from, and keeping that
# true is why the dashboard gets this topic and not a private one of its own.
topic write cubesat/command

# Everything else is denied by omission. Two of those omissions are the whole
# reason this file exists, and they are named here because an allowlist is also
# an inventory — whoever widens the rule above should have to read what
# widening it would reach:
#
#   cubesat/host/command   HOSTD's inbox, and HOSTD runs as root. Its vocabulary
#                          includes poweroff. OBC is the only thing that may
#                          publish there, and it does so over the localhost
#                          listener, which this file does not govern.
#
#   cubesat/+/status       The telemetry OBC makes decisions from. A forged
#                          eps_status claiming 4 % battery would walk the
#                          satellite down through LOW_POWER and SAFE into
#                          CRITICAL — the one state permitted to power the host
#                          off. Withholding a reading is a gap; inventing one is
#                          a shutdown.
#
# What a browser *can* still do through cubesat/command is everything the radio
# can: set_profile, safe_mode, take_photo. That is a deliberate decision, not an
# oversight — one command vocabulary, whatever the channel — and its sharp edge
# is EXPO, where the satellite is its own access point in a public room and a
# visitor issuing set_profile HOSTED ends the demonstration by taking the access
# point down. The ground vocabulary has no poweroff, so the worst case is a
# nuisance. If it becomes one in a real room, the fix is a per-profile command
# allowlist in DASHBOARD rather than a change here: this file cannot see which
# profile is active, and a fence that cannot read the situation should not be
# the one deciding it.
