# CubeSat Sim — mosquitto listeners.
#
# Installed to /etc/mosquitto/conf.d/cubesat.conf by scripts/install.sh.
#
# Two listeners, because there are two kinds of client here and they are not
# trusted alike:
#
#   1883  TCP on localhost, for the services on this Pi. They *are* the
#         satellite: OBC publishes the profile commands HOSTD acts on as root,
#         EPS publishes the battery telemetry OBC descends on. Bound to
#         localhost so nothing off the machine reaches it at all.
#
#   9001  WebSockets, for browsers. DASHBOARD serves the page; the page then
#         talks to this listener directly. There is deliberately no
#         MQTT-to-WebSocket bridge in this project — none to write, none to
#         test, and none to fall out of step with the topic list. A browser
#         subscribing here also receives every retained message on connect,
#         which is exactly what a freshly opened dashboard needs.
#
# per_listener_settings is what makes the split possible: without it a single
# acl_file governs both listeners, and the fence a browser needs would also
# stop OBC from reaching HOSTD.
per_listener_settings true

# ── the satellite's own bus ─────────────────────────────────────────────────
listener 1883 localhost
allow_anonymous true

# ── browsers ────────────────────────────────────────────────────────────────
listener 9001
protocol websockets
allow_anonymous true
# Anonymous is the only kind of client there can be here — there are no accounts
# to hand out at a science fair — so the topic fence is the whole of what
# separates a viewer from a publisher. The two denials in that file are
# load-bearing; read it before widening anything.
# NOT in conf.d/: mosquitto reads every file there as broker configuration, so
# an ACL file placed in conf.d is parsed as config and its first `topic` line
# kills the broker at startup with "Invalid bridge configuration" (bench-found,
# 2026-08-28 — the V8 failure mode exactly).
acl_file /etc/mosquitto/cubesat-acl.conf

persistence false
log_dest syslog
