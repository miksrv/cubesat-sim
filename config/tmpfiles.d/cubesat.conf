# The satellite's runtime directories, created once at boot by systemd-tmpfiles.
#
# These deliberately do NOT come from the units' StateDirectory/LogsDirectory/
# RuntimeDirectory. Those directives re-apply the *starting unit's* own User to
# the whole tree on every start, and this project runs two different users over
# the same three paths: cubesat-hostd as root, everything else as cubesat. The
# result was that whichever unit started last owned the directories — a HOSTD
# restart handed /var/lib/cubesat, /var/log/cubesat and /run/cubesat to root,
# and the unprivileged services silently lost the ability to write. DHS stopped
# recording, PAYLOAD could not create a mission's photo directory, and worst of
# all i2c.lock became unopenable, so hal/i2c.py fell back to a process-local
# lock and four processes stopped serialising the bus at all (found 2026-08-31).
#
# One owner, set in one place, independent of start order. HOSTD is root and
# writes here regardless.
#
# Mode 2775 rather than 0755: the setgid bit puts every new file in the cubesat
# group, so an operator who is a member of it — the account that runs
# scripts/deploy-dashboard.sh — can deliver the dashboard build without sudo.

#Type Path                       Mode UID     GID     Age Argument
d     /var/lib/cubesat           2775 cubesat cubesat -   -
d     /var/lib/cubesat/photos    2775 cubesat cubesat -   -
# DIAG's photographs, beside comms.db's rather than under a level of nesting in
# front of them. The two databases number their missions independently, both
# from 1, so one photos/<mission_id>/ for both meant DIAG mission 3 and FLIGHT
# mission 3 sharing a directory — and deleting the bench run from the archive
# dialog taking the trip's photographs with it. A sibling root keeps the leaf
# name a plain run of digits, which is the allowlist retention fences its
# deletions with. See common/config.py -> photos_root_for.
d     /var/lib/cubesat/photos-diag 2775 cubesat cubesat -   -
d     /var/lib/cubesat/dashboard 2775 cubesat cubesat -   -
d     /var/log/cubesat           2775 cubesat cubesat -   -
d     /run/cubesat               2775 cubesat cubesat -   -

# The I2C lock file itself, not just the directory it sits in. hal/i2c.py opens
# it O_WRONLY and falls back to a *process-local* lock if that fails, warning
# once and carrying on — correct on a laptop with no bus, silently wrong on the
# satellite, where it means four processes have stopped serialising a 10 kHz bus
# they all reach for. A file left behind by a previous owner is exactly how that
# happens: /run survives a service's lifetime, so one stale i2c.lock outlives
# whatever created it. Declaring it here gives it an owner that does not depend
# on which process got to the bus first.
f     /run/cubesat/i2c.lock      0664 cubesat cubesat -   -

# Where a photograph goes when no mission is open. /run is a tmpfs, so a frame
# written here costs RAM for the seconds between the capture and the publish and
# never touches the SD card — which is the whole point: in DEMO and EXPO the
# satellite is standing on a desk, and a photograph taken to be looked at once
# has no business being kept. It replaced photos/unfiled/, the one directory
# retention was forbidden to clean, which therefore only ever grew.
d     /run/cubesat/photo         2775 cubesat cubesat -   -
